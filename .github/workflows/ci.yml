name: Installer CI

on:
  push:
  schedule:
    # Monthly at 09:23 UTC on the first day of the month.
    - cron: "23 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-smoke-test:
    name: Ubuntu ${{ matrix.ubuntu-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            ubuntu-version: "24.04"
          - runner: ubuntu-26.04
            ubuntu-version: "26.04"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Check shell syntax
        run: >-
          bash -n install.sh new-computer-configure.sh
          kde/set-solids-kde-settings visit/install-visit-binaries
          tests/installer-smoke-test.sh

      - name: Refresh package indexes and check external downloads
        run: |
          sudo apt-get update
          curl --fail --location --silent --show-error --head \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
            >/dev/null
          for version_and_asset in \
            '3.5.0/visit3_5_0.linux-x86_64-ubuntu24.tar.gz' \
            '3.4.2/visit3_4_2.linux-x86_64-ubuntu24.tar.gz'; do
            curl --fail --location --silent --show-error --head \
              "https://github.com/visit-dav/visit/releases/download/v${version_and_asset}" \
              >/dev/null
          done

      - name: Exercise the installer
        env:
          EXPECTED_UBUNTU_VERSION: ${{ matrix.ubuntu-version }}
          CI_VALIDATE_APT: "1"
        run: tests/installer-smoke-test.sh
